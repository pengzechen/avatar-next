# platform.conf - qemu-virt-aarch64

platform = {
    arch = "aarch64",
    name = "QEMU",

    memory = {
        ram    = { base = 0x40000000, size = 0x80000000 },
        rootfs = { base = 0x5fe00000, size = 0x10200000, mb = 258 },
        reserves = {},
    },

    kernel = {
        link = 0xffff000040080000,
    },

    mmio_vma = true,
    lapic    = false,

    uart = {
        driver    = "pl011",
        base      = 0x09000000,
        reg_shift = 0,
    },

    irq = {
        driver = "gicv2",
        gicd   = 0x08000000,
        gicc   = 0x08010000,
        gich   = 0x08030000,
        gicr   = 0x080A0000,
        plic   = 0,
        clint  = 0,
    },

    timer = {
        driver     = "aarch64",
        tick_ms    = 10,
        freq_hz    = 100,
        cntp       = 26,
        counter_hz = 0,
    },

    eth = {
        driver = "virtio",
        base   = 0x0a003e00,
    },
}
