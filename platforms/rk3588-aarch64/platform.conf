# platform.conf - rk3588-aarch64

platform = {
    arch = "aarch64",
    name = "RK3588",

    memory = {
        ram    = { base = 0x00200000, size = 0xBFE00000 },
        rootfs = { base = 0x10000000, size = 0x08000000, mb = 128 },
        reserves = {
            { name = "kernel", start = 0x00200000, stop = 0x00800000 },
            # ── NPU 透传给 guest 用的恒等 DMA 区 ──────────────────────
            # 这段**物理**内存要让 guest 的 IPA 与它一一对应（IPA == PA），
            # 因为 RK3588 NPU 没有 IOMMU、只认物理地址。
            # 不从 PMM 摘出来的话，宿主会把这些页分给别的用途，guest 和宿主
            # 就会同时写同一片内存 —— 症状是"数据偶尔错"，极难查。
            # 三处必须一致：guest DTS 的 reserved-memory（0x79000000, 48MiB）、
            # include/guest_loader.h 的 GUEST_LINUX_NPU_DMA_*、以及这里。
            { name = "npu-guest-dma", start = 0x79000000, stop = 0x7C000000 },
        },
    },

    kernel = {
        link = 0xffff000000400000,
    },

    mmio_vma = true,
    lapic    = false,

    uart = {
        driver    = "dw",
        base      = 0xFEB50000,
        reg_shift = 2,
    },

    irq = {
        driver = "gicv3",
        gicd   = 0xFE600000,
        gicc   = 0,
        gich   = 0,
        gicr   = 0xFE680000,
        plic   = 0,
        clint  = 0,
    },

    timer = {
        driver     = "aarch64",
        tick_ms    = 10,
        freq_hz    = 100,
        cntp       = 26,
        counter_hz = 0,
    },

    npu = {
        driver = "rknpu",
        base0 = 0xFDAB0000,
        base1 = 0xFDAC0000,
        base2 = 0xFDAD0000,
        pmu   = 0xFD8D8000,
        irq0  = 142,
        irq1  = 143,
        irq2  = 144,
    },
}
