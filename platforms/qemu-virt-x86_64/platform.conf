# platform.conf - qemu-virt-x86_64

platform = {
    arch = "x86_64",
    name = "QEMU",

    memory = {
        ram    = { base = 0x00100000, size = 0x7FF00000 },
        rootfs = { base = 0x04000000, size = 0x10000000, mb = 256 },
        reserves = {
            { name = "lowmem_1m_2m", start = 0x00100000, stop = 0x001FFFFF },

            # guest Linux 的物理内存窗口（GUEST_X86_HPA_BASE/SIZE）。
            # x86 的 guest 物理地址从 0 开始，宿主侧得另找一块连续的物理内存
            # 承载它，由 EPT 做 GPA→HPA 翻译。必须在这里预留：等到启动 guest
            # 时才 pmm_mark_allocated 的话，中间任何一次宿主分配都可能落进
            # 窗口，随后被 guest RAM 的 memset 静默踩掉。
            { name = "guest_ram", start = 0x20000000, stop = 0x2BFFFFFF },
        },
    },

    mmio_vma = false,
    lapic    = true,

    uart = {
        driver    = "x86",
        base      = 0,
        reg_shift = 0,
    },

    irq = {
        driver = "none",
        gicd   = 0,
        gicc   = 0,
        gich   = 0,
        gicr   = 0,
        plic   = 0,
        clint  = 0,
    },

    timer = {
        driver     = "x86",
        tick_ms    = 10,
        freq_hz    = 100,
        cntp       = 0,
        counter_hz = 0,
    },

    eth = {
        driver = "virtio",
        base   = 0xfeb02e00,
    },
}
