# platform.conf - qemu-virt-x86_64

platform = {
    arch = "x86_64",
    name = "QEMU",

    memory = {
        ram    = { base = 0x00100000, size = 0x7FF00000 },
        rootfs = { base = 0x04000000, size = 0x10000000, mb = 256 },
        reserves = {
            { name = "lowmem_1m_2m", start = 0x00100000, stop = 0x001FFFFF },

            # 注：这里**曾经**有一段 192 MiB 的 guest_ram 预留
            # （0x20000000..0x2BFFFFFF），理由是"guest 的物理内存必须预先整段
            # 占住，否则会被宿主分配踩掉"（那时 EPT 走 identity + 线性偏移）。
            #
            # x86 的 EPT 跟着 aarch64/riscv 改成**按需分页**之后这条理由消失了：
            # guest 的每一页都是缺页时从 PMM 现拿的，落到哪里由 PMM 决定，与
            # guest 的 GPA 再无对应关系。留着它反而白白占掉 192 MiB，所以删掉。
        },
    },

    mmio_vma = false,
    lapic    = true,

    uart = {
        driver    = "x86",
        base      = 0,
        reg_shift = 0,
    },

    irq = {
        driver = "none",
        gicd   = 0,
        gicc   = 0,
        gich   = 0,
        gicr   = 0,
        plic   = 0,
        clint  = 0,
    },

    timer = {
        driver     = "x86",
        tick_ms    = 10,
        freq_hz    = 100,
        cntp       = 0,
        counter_hz = 0,
    },

    eth = {
        driver = "virtio",
        base   = 0xfeb02e00,
    },
}
