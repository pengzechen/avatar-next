# platform.conf - sg2002-riscv64

platform = {
    arch = "riscv64",
    name = "SG2002",

    memory = {
        ram    = { base = 0x80000000, size = 0x10000000 },
        rootfs = { base = 0x89000000, size = 0x04000000, mb = 64 },
        reserves = {
            { name = "opensbi",  start = 0x80000000, stop = 0x801FFFFF },
            { name = "boot_low", start = 0x80200000, stop = 0x80205FFF },
        },
    },

    mmio_vma = true,
    lapic    = false,

    uart = {
        driver    = "dw",
        base      = 0x04140000,
        reg_shift = 2,
    },

    irq = {
        driver = "none",
        gicd   = 0,
        gicc   = 0,
        gich   = 0,
        gicr   = 0,
        plic   = 0x70000000,
        clint  = 0x74000000,
    },

    # counter_hz 必须等于 rdtime 的真实频率：timer_arch_init() 会把它赋给
    # g_timer_frequency，timer_schedule_next_tick() 用它算 ticks_per_interrupt，
    # timer_delay_ms()/timer_counter_to_ns()/lwIP 的 sys_now() 全都依赖它。
    # 出处：本目录 sg2002_licheervnano_sd.full.dts 的 /cpus/timebase-frequency
    #       = 0x17d7840 = 25000000。
    # 曾误配为 4000000（差 6.25 倍），症状是 "10ms" tick 实际 1.6ms、
    # timer_get_uptime_ms() 快 6.25 倍，并且以太网 PHY 自协商等待被砍到 400ms。
    timer = {
        driver     = "rv",
        tick_ms    = 10,
        freq_hz    = 100,
        cntp       = 0,
        counter_hz = 25000000,
    },

    tpu = {
        driver    = "cvitpu",
        tdma_base = 0x0C100000,
        tiu_base  = 0x0C101000,
        tdma_irq  = 73,
    },

    sdmmc = {
        sd_base            = 0x04310000,
        top_base           = 0x03000000,
        top_off_pwrsw_ctrl = 0x1F4,
    },

    # 板载 DWMAC 3.70a + 内部 EPHY（driver/eth/cvitek_eth.c）。
    # mmio_vma 已置 true，platform_get_mmio("eth","base") 会返回高半别名。
    # CLKGEN(0x03002000) / RSTC(0x03003000) 是 SG2002 固定地址，写在驱动里。
    eth = {
        driver = "cvitek",
        base   = 0x04070000,
    },
}
