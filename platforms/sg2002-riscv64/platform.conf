# platform.conf - sg2002-riscv64

platform = {
    arch = "riscv64",
    name = "SG2002",

    memory = {
        ram    = { base = 0x80000000, size = 0x10000000 },
        rootfs = { base = 0x89000000, size = 0x04000000, mb = 64 },
        reserves = {
            { name = "opensbi",  start = 0x80000000, stop = 0x801FFFFF },
            { name = "boot_low", start = 0x80200000, stop = 0x80205FFF },
        },
    },

    mmio_vma = true,
    lapic    = false,

    uart = {
        driver    = "dw",
        base      = 0x04140000,
        reg_shift = 2,
    },

    irq = {
        driver = "none",
        gicd   = 0,
        gicc   = 0,
        gich   = 0,
        gicr   = 0,
        plic   = 0x70000000,
        clint  = 0x74000000,
    },

    timer = {
        driver     = "rv",
        tick_ms    = 10,
        freq_hz    = 100,
        cntp       = 0,
        counter_hz = 4000000,
    },

    tpu = {
        driver    = "cvitpu",
        tdma_base = 0x0C100000,
        tiu_base  = 0x0C101000,
        tdma_irq  = 73,
    },

    sdmmc = {
        sd_base            = 0x04310000,
        top_base           = 0x03000000,
        top_off_pwrsw_ctrl = 0x1F4,
    },
}
