# platform.conf - qemu-virt-riscv64

platform = {
    arch = "riscv64",
    name = "QEMU",

    memory = {
        ram    = { base = 0x80000000, size = 0x80000000 },
        rootfs = { base = 0x88000000, size = 0x10000000, mb = 256 },
        reserves = {
            { name = "opensbi",  start = 0x80000000, stop = 0x801FFFFF },
            { name = "boot_low", start = 0x80200000, stop = 0x80205FFF },

            # 注：这里**曾经**有一段 192 MiB 的 guest_ram 预留
            # （0xA0000000..0xABFFFFFF），理由是"guest 的物理内存必须预先
            # 整段占住，否则会被宿主分配踩掉"。
            #
            # riscv 的 G-stage 跟着 aarch64 改成**按需分页**之后这条理由消失了：
            # guest 的每一页都是缺页时从 PMM 现拿的，落到哪里由 PMM 决定，
            # 与 guest 的 GPA 窗口（GUEST_LINUX_MEM_BASE=0xA0000000）再无对应
            # 关系 —— 那个地址现在只是 guest 眼里的地址。
            # 留着它反而白白占掉 192 MiB，所以删掉。
        },
    },

    mmio_vma = true,
    lapic    = false,

    uart = {
        driver    = "dw",
        base      = 0x10000000,
        reg_shift = 0,
    },

    irq = {
        driver = "none",
        gicd   = 0,
        gicc   = 0,
        gich   = 0,
        gicr   = 0,
        plic   = 0x0C000000,
        clint  = 0x02000000,
    },

    timer = {
        driver     = "rv",
        tick_ms    = 10,
        freq_hz    = 100,
        cntp       = 0,
        counter_hz = 10000000,
    },

    eth = {
        driver = "virtio",
        base   = 0x10008000,
    },
}
