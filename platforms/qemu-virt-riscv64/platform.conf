# platform.conf - qemu-virt-riscv64

platform = {
    arch = "riscv64",
    name = "QEMU",

    memory = {
        ram    = { base = 0x80000000, size = 0x80000000 },
        rootfs = { base = 0x88000000, size = 0x10000000, mb = 256 },
        reserves = {
            { name = "opensbi",  start = 0x80000000, stop = 0x801FFFFF },
            { name = "boot_low", start = 0x80200000, stop = 0x80205FFF },

            # guest Linux 的物理内存窗口（GUEST_LINUX_MEM_BASE/SIZE，
            # 见 include/guest_loader.h）。在这里预留而不是等到启动 guest
            # 时才 pmm_mark_allocated：那样中间的任何一次宿主分配都可能
            # 落到窗口里，随后会被 guest RAM 的 memset 静默踩掉。
            #
            # 位置不是随手挑的：必须在宿主内核直接映射覆盖的
            # 0x00000000..0xBFFFFFFF 之内（kernel/mm/riscv64/mmu.S），
            # 且避开 rootfs 窗口 0x88000000..0x98000000。
            # 192 MiB 是 guest DTB 声明的内存大小。
            { name = "guest_ram", start = 0xA0000000, stop = 0xABFFFFFF },
        },
    },

    mmio_vma = true,
    lapic    = false,

    uart = {
        driver    = "dw",
        base      = 0x10000000,
        reg_shift = 0,
    },

    irq = {
        driver = "none",
        gicd   = 0,
        gicc   = 0,
        gich   = 0,
        gicr   = 0,
        plic   = 0x0C000000,
        clint  = 0x02000000,
    },

    timer = {
        driver     = "rv",
        tick_ms    = 10,
        freq_hz    = 100,
        cntp       = 0,
        counter_hz = 10000000,
    },

    eth = {
        driver = "virtio",
        base   = 0x10008000,
    },
}
