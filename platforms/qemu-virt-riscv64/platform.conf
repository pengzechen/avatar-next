# platform.conf - qemu-virt-riscv64

platform = {
    arch = "riscv64",
    name = "QEMU",

    memory = {
        ram    = { base = 0x80000000, size = 0x80000000 },
        rootfs = { base = 0x88000000, size = 0x10000000, mb = 256 },
        reserves = {
            { name = "opensbi",  start = 0x80000000, stop = 0x801FFFFF },
            { name = "boot_low", start = 0x80200000, stop = 0x80205FFF },
        },
    },

    mmio_vma = true,
    lapic    = false,

    uart = {
        driver    = "dw",
        base      = 0x10000000,
        reg_shift = 0,
    },

    irq = {
        driver = "none",
        gicd   = 0,
        gicc   = 0,
        gich   = 0,
        gicr   = 0,
        plic   = 0x0C000000,
        clint  = 0x02000000,
    },

    timer = {
        driver     = "rv",
        tick_ms    = 10,
        freq_hz    = 100,
        cntp       = 0,
        counter_hz = 10000000,
    },

    eth = {
        driver = "virtio",
        base   = 0x10008000,
    },
}
