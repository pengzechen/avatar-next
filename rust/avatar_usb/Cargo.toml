[package]
name = "avatar_usb"
version = "0.1.0"
edition = "2024"
description = "Avatar OS kernel Rust USB adapter (C FFI bridge to cvitek-usb)"

[dependencies]
cvitek-usb = { path = "../../driver/cvitek-usb", features = ["cv182x-host", "c906"] }
kernel_support = { path = "../kernel_support" }
log = { workspace = true }

[lib]
crate-type = ["staticlib"]
