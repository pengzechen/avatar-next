[package]
name = "avatar_eth"
version = "0.1.0"
edition = "2021"
description = "Avatar OS kernel Rust ethernet adapter (C FFI bridge to cvitek-eth)"

[dependencies]
# cvitek-eth BSP 驱动（启用 C906 dcache 指令）
cvitek-eth = { path = "../../driver/cvitek-eth", features = ["c906"] }
# 内核支撑库（GlobalAllocator / panic_handler / klog 桥接）
kernel_support = { path = "../kernel_support" }
log = { workspace = true }

[lib]
# 编译为静态库，由 C 内核链接器直接链接
crate-type = ["staticlib"]
