[package]
name = "cvitek-eth"
version = "0.1.0"
edition = "2021"
description = "SG2002/CV1812H ethernet driver (DWMAC 3.70a + internal EPHY), extracted from sg200x-bsp"

[dependencies]
tock-registers = "0.9"
log = { version = "0.4", default-features = false }

[features]
# 默认启用 T-Head C906 非标 D-cache 维护指令（dcache.cva/iva/ciall）
# 在非 C906 RISC-V 核上必须关闭，否则会执行未定义指令
default = ["c906"]
c906 = []
